# This file is used to store secrets like usernames and passwords.
# Mor info at https://www.home-assistant.io/docs/configuration/secrets/

# Token for API access on your forked AndroidAPS GitHub repository
# Note: that your token appears twice. The ..access_token_header however has the prefix "Bearer "
aaps_ci_access_token_header: "Bearer <Your AAPS CI Personal token>"
aaps_ci_access_token_ha: "<Your AAPS CI Personal token>"

# Github sensors
# Define full url your repository. Example:
#   github_commits_url: "https://api.github.com/repos/<repository name>/commits?sha=<branch>"

# GitHub integration for main nightscout/AndroidAPS repository
github_commits_url: "https://api.github.com/repos/nightscout/AndroidAPS/commits?sha=dev"
