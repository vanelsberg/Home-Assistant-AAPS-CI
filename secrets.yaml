# This file is used to store secrets like usernames and passwords.
# More info at https://www.home-assistant.io/docs/configuration/secrets/

### Github sensors ###
# Define full url your repository. Example:
#   github_commits_url: "https://api.github.com/repos/<repository name>/commits?sha=<branch>"

# GitHub integration for main nightscout/AndroidAPS repository
github_commits_url: "https://api.github.com/repos/nightscout/AndroidAPS/commits?sha=dev"

### Workflow status ###
# Token for API access on your forked AndroidAPS GitHub repository created for AAPS_CI status access
# See: https://github.com/settings/personal-access-tokens, classic token

# Note: that your token appears twice. The ..access_token_header however has the prefix "Bearer "
aaps_ci_access_token_header: "Bearer <Your AAPS CI Personal token>"
aaps_ci_access_token_ha: "<Your AAPS CI Personal token>"

### API Access token for workflow maintenance ###
# Personal access token for deleting workflow runs: Repo=vanelsberb/AndroidAPS, Action Read and Write access
# See: https://github.com/settings/personal-access-tokens, fine grained token
workflow_access_token_ha: "<Your Github API access token for AAPS CI Workflow maintenance>"
