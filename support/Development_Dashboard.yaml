title: Home
views:
  - theme: Backend-selected
    title: Home
    badges: []
    cards: []
    type: sections
    sections:
      - type: grid
        cards:
          - type: heading
            heading: AndroidAPS CI Browserbuild Workflow
            heading_style: title
            grid_options:
              columns: full
              rows: 1
          - show_name: true
            show_icon: true
            type: button
            entity: sensor.ci_status_label
            name: Start CI Run
            tap_action:
              action: call-service
              service: script.trigger_github_aaps_ci
            grid_options:
              columns: 6
              rows: 5
            show_state: true
            icon: mdi:electron-framework
          - type: entities
            title: AAPS-CI Web Build
            entities:
              - entity: sensor.androidaps_workflow_name
                name: Workflow
                icon: mdi:electron-framework
                card_mod:
                  style: |
                    :host {
                      --card-mod-icon-color:
                        green
                    }
              - entity: sensor.androidaps_workflow_branch
                name: Branch
                icon: mdi:electron-framework
                card_mod:
                  style: |
                    :host {
                      --card-mod-icon-color:
                        green
                    }
              - entity: sensor.androidaps_workflow_created_at
                name: Created At
                icon: mdi:electron-framework
                card_mod:
                  style: |
                    :host {
                      --card-mod-icon-color:
                        green
                    }
              - entity: sensor.androidaps_workflow_status
                name: Status
                icon: mdi:electron-framework
                secondary_info: last-changed
                card_mod:
                  style: |
                    :host {
                      --card-mod-icon-color:
                        {% if states('sensor.androidaps_workflow_status') == 'in_progress' %}
                          orange
                        {% elif states('sensor.androidaps_workflow_status') == 'completed' %}
                          green
                        {% else %}
                          grey
                        {% endif %};
                    }
              - entity: sensor.androidaps_workflow_conclusion
                name: Conclusion
                icon: mdi:electron-framework
                secondary_info: last-changed
                card_mod:
                  style: |
                    :host {
                      --card-mod-icon-color:
                        {% if states('sensor.androidaps_workflow_conclusion') == 'success' %}
                          green
                        {% elif states('sensor.androidaps_workflow_conclusion') == 'Unknown' %}
                          red
                        {% else %}
                          grey
                        {% endif %};
                    }
            show_header_toggle: false
            grid_options:
              columns: 15
              rows: 5
          - type: markdown
            content: >-
              - [Download AndroidAPS
              APK](https://drive.google.com/drive/folders/1XhfUYeBzSeU0yoC48M9UyBEo1SRcak0j?usp=drive_link)
            grid_options:
              columns: full
              rows: 1
            visibility:
              - condition: user
                users:
                  - b4860a651b7b4b94b17803c926028d2c
              - condition: state
                entity: sensor.androidaps_workflow_conclusion
                state: success
          - type: markdown
            content: >-
              - [Github
              Actions](https://github.com/vanelsberg/AndroidAPS/actions)

              - [Github AndroidAPS
              Development](https://github.com/nightscout/AndroidAPS/tree/dev)
            grid_options:
              rows: 2
              columns: full
            visibility:
              - condition: user
                users:
                  - b4860a651b7b4b94b17803c926028d2c
        column_span: 4
      - type: grid
        cards:
          - type: history-graph
            hours_to_show: 48
            entities:
              - entity: sensor.androidaps_workflow_status
              - entity: sensor.androidaps_workflow_conclusion
            logarithmic_scale: false
            grid_options:
              columns: full
              rows: 2
        column_span: 4
      - type: grid
        cards:
          - type: heading
            heading: New section
          - type: markdown
            title: AndroidAPS Latest Commit
            content: >

              | _Field_ | _Value_ |

              |:---------------|:-----------|

              | **Message** | **{{ states('sensor.github_latest_commit_message')
              }}** |

              | **Timestamp** | {{
              states('sensor.github_latest_commit_timestamp') }} |

              | **SHA** | `{{ states('sensor.github_latest_commit_sha')[:7] }}`
              |

              | **Age** | {{ states('sensor.github_latest_commit_age_hours') }}
              h |

              | **New Commit** | {{
              states('binary_sensor.github_new_commit_available') }} |

              | **Last build** | {{ states('input_text.github_last_built_sha')
              }} |

              | **Rate Limit Remaining** | {{
              states('sensor.github_rate_limit_remaining') }} |
            grid_options:
              columns: full
              rows: auto
        column_span: 4
